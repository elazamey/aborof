name: Turso evidence probe

# ‏أداة قياس لا أداة نشر: تفتح اتصالًا **للقراءة فقط** بقاعدة الإنتاج وتطبع جدول
# الصفوف (conn · conn-token-shape · conn-cause · mig-table · mig-parity · row-7 ·
# row-8 · row-9 · tables) في ملخّص التشغيل وسجلّه وفي تعليق على طلب الدمج —
# بلا أي كتابة وبلا أي سرّ في المخرجات (السكربت ينقّي الرابط والرمز قبل الطباعة).
#
# المشغّلات:
#  - `pull_request`: السؤال «هل القاعدة مطابقة للكود؟» سؤال ما قبل الدمج، فيُطرح
#    في مكانه الطبيعي بدل انتظار تشغيل يدوي بعد النشر.
#  - `workflow_dispatch`: التشغيل اليدوي متى شئت.
#
# ‏أداة **أدلة لا بوابة**: حالة قاعدة الإنتاج لا تُحمرّ نقطة التحقق في الطلب (وإلا
# بدا كل طلب مكسورًا بسبب إعداد خارجي)، لكن الفشل يُعلَن مرّتين: تعليق بالجدول
# كاملًا + إشعار `::error::` في تبويب الفحوص. البوابة الحاجبة تبقى Quality and Security.
#
# نطاق الأسرار: الوظيفة الأولى تقرأ نطاق المستودع، والثانية تعمل فقط عند غيابه
# لتجرّب نطاق بيئة `production` — فيعرف المالك من التعليق أيّ النطاقين مضبوط.
# (بيئات GitHub لا تُقرأ من وظيفة واحدة بلا `environment` على مستوى الوظيفة.)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: turso-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # نشر/تحديث تعليق الجدول على طلب الدمج (لا صلاحية كتابة على المحتوى).
  pull-requests: write

jobs:
  repo-scope:
    name: Probe (repository-scope secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect secret scope
        id: detect
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          if [ -n "${TURSO_DATABASE_URL:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ TURSO_DATABASE_URL مرئي من نطاق المستودع."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TURSO_DATABASE_URL غير مضبوط على نطاق المستودع — ستجرّب الوظيفة التالية نطاق بيئة production."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # اعتماديات الإنتاج فقط — @libsql/client بينها، بنفس النسخ المقفولة في
      # التطبيق (package-lock.json) فلا انحراف بين الفحص والإنتاج.
      - name: Install production dependencies
        if: steps.detect.outputs.configured == 'true'
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Turso probe (read-only)
        if: steps.detect.outputs.configured == 'true'
        # كود الخروج يُترجم إشعارًا وتعليقًا لا نقطة حمراء — انظر ترويسة الملف.
        continue-on-error: true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SCOPE: "أسرار نطاق المستودع"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/probe-turso-ci.sh

  env-scope:
    name: Probe (environment-scope secrets)
    needs: repo-scope
    if: needs.repo-scope.outputs.configured != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # قد ترفض سياسة حماية البيئة (`Production` = الفروع المحمية فقط) تشغيل هذا
    # الفرع، ونتيجة الفحص الأحمر في قاعدة غير مهيّأة متوقّعة — فلا تُفشل بوابة
    # الطلب؛ الغرض تسجيل الأدلة لا حجب الدمج.
    continue-on-error: true
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Turso probe (read-only)
        continue-on-error: true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SCOPE: "أسرار بيئة production"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${TURSO_DATABASE_URL:-}" ]; then
            echo "::warning::TURSO_DATABASE_URL غير مضبوط على نطاق المستودع ولا على بيئة production — أضِفه في Settings → Secrets and variables → Actions."
            exit 0
          fi
          bash scripts/probe-turso-ci.sh
