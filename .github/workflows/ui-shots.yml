# مؤقت: التقاط لقطات شاشة للتحقق البصري (يُحذف بعد استلام اللقطات)
name: UI Screenshots

on:
  push:
    branches: [arena/01a05f01-aborof]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install playwright-core (no-save)
        run: npm i --no-save playwright-core

      - name: Build
        run: npm run build

      - name: Start server + capture shots
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          TURSO_DATABASE_URL=file:/tmp/shots.db TURSO_AUTH_TOKEN=shots \
          ADMIN_PASSWORD=admin ADMIN_SESSION_SECRET=shots-secret-0123456789abcdef \
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
          node scripts/ui-shots.mjs http://localhost:3000

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: evidence/ui-cinematic/shots/
          if-no-files-found: error
