# TEMPORARY TOOL — UI screenshots of the current interface (removed after use).
# Triggered by a tag push `shots-*` (no actions:write needed). Never touches deploy/production.
# The runner pushes the captured PNGs + diagnostics directly to the branch (artifacts unreachable
# from the dev sandbox); the temp files are removed in a follow-up cleanup commit.
name: UI screenshots (temp tool)
on:
  push:
    tags: ["shots-*"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Create local DB (schema v3 + production-equivalent catalog), start app
        env:
          TURSO_DATABASE_URL: file:/tmp/shots.db
        run: |
          set -e
          node --experimental-strip-types scripts/migrate-check.mts
          node --experimental-strip-types --input-type=module -e '
            import { createClient } from "@libsql/client";
            import { SEED_PRODUCTS } from "./src/lib/seed.ts";
            const c = createClient({ url: "file:/tmp/shots.db" });
            await c.execute("DELETE FROM products");
            for (const p of SEED_PRODUCTS) {
              await c.execute({
                sql: "INSERT INTO products (id,name,description,price,old_price,category,image,stock,featured) VALUES (?,?,?,?,?,?,?,?,?)",
                args: [p.id, p.name, p.description, p.price, p.old_price ?? null, p.category, p.image, p.stock, p.featured ?? 0],
              });
            }
            for (const f of [
              ["طرق الدفع", "فودافون كاش على 01095032221 أو الدفع عند الاستلام."],
              ["الشحن", "50 جنيه، ومجاني فوق 1000 جنيه. التوصيل خلال 1-3 أيام."],
              ["الجملة", "أسعار خاصة للجملة — تواصل واتساب 01095032221."],
            ]) {
              await c.execute({ sql: "INSERT INTO faq (question, answer) VALUES (?,?)", args: f });
            }
            console.log("seeded:", SEED_PRODUCTS.length, "products");
          '
          export TURSO_DATABASE_URL=file:/tmp/shots.db
          export ADMIN_SESSION_SECRET=$(openssl rand -hex 16)
          export PORT=3199
          (npx next start -p 3199 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3199/ > /dev/null && echo "server ready" && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3199/ > /dev/null || { echo "SERVER FAILED"; cat /tmp/server.log; exit 1; }
      - name: Capture screenshots
        run: |
          node scripts/screenshot-ui.mjs > /tmp/capture.log 2>&1 || echo "node-exit=$?" >> /tmp/capture.log
          echo "::notice title=capture-tail::$(tail -12 /tmp/capture.log | tr '\n' '|')"
          exit 0
      - name: Push captured files to branch (temp)
        if: always()
        run: |
          set +e
          mkdir -p .tmp-ui-shots/debug
          cp -r /tmp/ui-shots/* .tmp-ui-shots/ 2>/dev/null
          cp /tmp/capture.log .tmp-ui-shots/debug/capture.log 2>/dev/null
          cp /tmp/server.log .tmp-ui-shots/debug/server.log 2>/dev/null
          N=$(ls /tmp/ui-shots/*.png 2>/dev/null | wc -l)
          echo "::notice title=shots-count::PNG count = $N"
          git config user.name "ui-shots-bot"
          git config user.email "ui-shots-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A .tmp-ui-shots
          git commit -m "ui-shots(temp): captured screenshots + diagnostics" 2>&1 | tail -1
          CE=${PIPESTATUS[0]}
          git push origin HEAD:refs/heads/arena/01a05f01-aborof 2>&1 | tail -3
          PE=${PIPESTATUS[0]}
          echo "::notice title=push-result::commit-exit=$CE push-exit=$PE"
