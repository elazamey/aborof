name: Vercel Preflight Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify Vercel identity only
    # Production secrets are used only with code reviewed on main.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_EXPECTED_PROJECT: ${{ vars.VERCEL_EXPECTED_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify required inputs exist
        shell: bash
        run: |
          set -euo pipefail

          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

          echo "Required Vercel inputs are present."

      - name: Vercel preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/vercel-preflight.mjs
