name: Turso credential audit

# أين جاءت قيمة `TURSO_AUTH_TOKEN` الفعلية؟ وما العلاج؟ — تقرير واحد يجمع
# طبقتين من الأدلة، ومخرجات الملف **رموز حالة وأوصاف شكليّة فقط** (لا جسم،
# لا ترويسة، لا قيمة — لا في السجل ولا في الملخّص ولا في التعليق):
#
# الطبقة1 — عائلة الترخيص (GET فقط على api.turso.tech):
#   - هل `TURSO_AUTH_TOKEN` يُقبل كتوكن **منصّة**؟ (200 ⇒ نعم — القيمة في
#     الحقل الخاطئ · 401 ⇒ ليست من Turso أصلًا)
#   - وهل `TURSO_PLATFORM_TOKEN` (الاسم الصحيح لدور المنصّة) مضبوط أصلًا إن وُجد.
#
# الطبقة2 — سكّ + فحص حيّ (بصيغة `--dry-run` — **لا كتابة على GitHub ولا
# Vercel أبدًا**): `mint-turso-token.sh` يحوّل `TURSO_PLATFORM_TOKEN` إلى
# (رابط + توكن قاعدة PROD + توكن قاعدة CI) عبر Platform API ثم يمرّرهما في
# بوابات transactional: GATE_AUTH → GATE_IDENTITY → GATE_SCHEMA → GATE_CI_AUTH
# — فشل مغلق قبل أي لمس — ثم حاجز `apply-turso-secrets.sh` الحيّ.
# الكتابة الوحيدة في الطبقة2: إنشاء توكنَي قاعدة **مدة1 يوم** على المنصّة
# (يُهملان وحدهما) — بلا لمس القاعدة وبلا لمس أي سر — والمعاينة بلا بوابة
# هجرات أبدًا (`--dry-run`).
#
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: turso-credential-audit-${{ github.ref }}
  cancel-in-progress: true

# أقل صلاحية تسمح بتعليق على الطلب إن توفر رقمه؛ لا كتابة على المحتوى.
permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Credential origin probe + mint verify (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # أسرار بيئة production — نفس النطاق الذي يقرأه المجسّ ووظيفة النشر.
    environment: production
    # على طلبات هذا الفرع فقط (لا نشغّره على طلبات الآخرين) — ويدويًا متى شئت.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'arena/01a0ea5f-aborof'
    steps:
      - name: Layer 1 — credential family (HTTP codes only)
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -uo pipefail
          # رمز الحالة فقط — ولا شيء غيره. `000` = فشل الشبكة قبل أي استجابة.
          code_probe() { # $1=وصف · $2=ترويسة اختيارية ("" = بلا مصادقة) · $3=الرابط
            local label="$1" header="$2" code
            if [ -n "$header" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "$header" "$3" || true)
            else
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$3" || true)
            fi
            code=${code:-000}
            echo "${label} → HTTP ${code}"
          }
          verdict_for() {
            case "$1" in
              200) echo "✅ **توكن منصّة صالح** — هذه القيمة هي مفتاح توليد توكن القاعدة" ;;
              401|403) echo "❌ مرفوض — ليست من Turso (توكن أجنبي)" ;;
              404) echo "⚠️ غير حاسم — نقطة النهاية غير موجودة" ;;
              *) echo "⚠️ غير حاسم — فشل شبكة/استجابة" ;;
            esac
          }

          ORG_API="https://api.turso.tech/v1/organizations"
          USER_API="https://api.turso.tech/v1/user"

          {
            echo "### 🧾 تدقيق عائلة الترخيص — Turso credential audit"
            echo
            echo "- التشغيل: ${RUN_URL:-محلي} · **رموز حالة فقط** — لا قيمة تُطبع."
            echo
            echo "| المرشح | النقطة | رمز الحالة | الحكم |"
            echo "|---|---|---|---|"
            base=$(code_probe "baseline" "" "$ORG_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
            echo "| بلا مصادقة (خط أساس) | GET /v1/organizations | ${base:-000} | خط الأساس الحيّ |"

            c1=""; c2=""
            if [ -n "${TURSO_AUTH_TOKEN:-}" ]; then
              c1=$(code_probe "auth" "Authorization: Bearer ${TURSO_AUTH_TOKEN}" "$ORG_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
              echo "| TURSO_AUTH_TOKEN (مضبوط) | GET /v1/organizations | ${c1:-?} | $(verdict_for "${c1:-}") |"
              c2=$(code_probe "auth" "Authorization: Bearer ${TURSO_AUTH_TOKEN}" "$USER_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
              echo "| TURSO_AUTH_TOKEN (مضبوط) | GET /v1/user | ${c2:-?} | $(verdict_for "${c2:-}") |"
            else
              echo "| TURSO_AUTH_TOKEN | — | — | غير مضبوط أصلًا |"
            fi

            c3=""
            if [ -n "${TURSO_PLATFORM_TOKEN:-}" ]; then
              c3=$(code_probe "api" "Authorization: Bearer ${TURSO_PLATFORM_TOKEN}" "$ORG_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
              echo "| TURSO_PLATFORM_TOKEN (مضبوط) | GET /v1/organizations | ${c3:-?} | $(verdict_for "${c3:-}") |"
            else
              echo "| TURSO_PLATFORM_TOKEN | — | — | غير مضبوط |"
            fi
          } > "$HOME/audit.md"

          # تشخيص ظاهر في تبويب الفحوص: حضور المتغيرات والأرقام فقط — لا قيم.
          echo "::notice::audit-layer1 codes=[baseline:${base:-?} auth-org:${c1:-?} auth-user:${c2:-?} platform-named:${c3:-not-set}]"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Layer 2 — mint DB token from platform token + live verify (dry-run)
        env:
          # الاسم الصحيح لدور المنصّة (نقطة1 في مراجعة المسار)؛ الجسر إلى
          # TURSO_AUTH_TOKEN المضبوط اليوم فقط ما دام الاسم الجديد خاليًا.
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN || secrets.TURSO_AUTH_TOKEN }}
          # مدة قصيرة في CI — أثر كل سكّ ينتهي وحده خلال يوم.
          TURSO_TOKEN_EXPIRATION: 1d
          TURSO_CI_TOKEN_EXPIRATION: 1d
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_DB: ${{ vars.TURSO_DB }}
        run: |
          set -uo pipefail
          {
            echo
            echo "### 🪙 سكّ توكن القاعدة من توكن المنصّة + فحص حيّ — \`--dry-run\` (بلا كتابة على GitHub أو Vercel)"
            echo '```'
            rc=0
            bash scripts/mint-turso-token.sh --dry-run > "$HOME/mint-out.txt" 2>&1 || rc=$?
            cat "$HOME/mint-out.txt"
            echo "MINT_EXIT=${rc}"
            echo '```'
          } >> "$HOME/audit.md"

          # قناة ظاهرة دائمًا في تبويب الفحوص: أسماء الأحكام فقط (GATE_*=*) بلا أي قيمة.
          gates=$(grep -oE 'GATE_[A-Z_]+=[A-Za-z_]+' "$HOME/mint-out.txt" 2>/dev/null | tr '\n' ' ' || true)
          echo "::notice::audit-layer2 mint_dry_run=${rc} gates=[${gates:-none}]"

      - name: Publish audit report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # لا checkout هنا فقط — لكن المستودع موجود بالفعل من خطوة Checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          cat "$HOME/audit.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$HOME/audit.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${GH_TOKEN:-}" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$HOME/audit.md" \
              || echo "::warning::تعذّر نشر التعليق — التقرير في ملخّص التشغيل."
          else
            echo "::warning::شرط التعليق لم يستوفِ pr أو gh_token — التقرير في ملخّص التشغيل فقط."
          fi
