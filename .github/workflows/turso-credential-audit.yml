name: Turso credential audit

# أين جاءت قيمة `TURSO_AUTH_TOKEN` الفعلية؟ — تجربة **قراءة واحدة** لكل مرشح،
# ومخرجات الملف **رموز حالة HTTP فقط** (لا جسم، لا ترويسة، لا قيمة — لا في
# السجل ولا في الملخّص ولا في التعليق). سؤال واحد حاسم:
#
#   هل القيمة المضبوطة حاليًا تُقبل كـ**توكن منصّة Turso** على `api.turso.tech`؟
#   - 200 ⇒ المالك يملك توكن المنصّة بالفعل (لصقته في الحقل الخاطئ) — علاجه
#     إنشاء توكن قاعدة **من نفس القيمة** بأمر واحد، لا الإنشاء من لوحة جديدة.
#   - 401/403 ⇒ القيمة ليست من Turso أصلًا (وهو ما يرجّحه مجسّ PR: alg EdDSA
#     بلا ادّعاءي db/org وردّ الخادم `can't be decoded with any of the existing
#     keys`) — العلاج: توكن جديد من لوحة Turso ← Tokens.
#   - 404/000 ⇒ غير حاسم (نقطة النهاية متغيّرة أو شبكة) — يُبلَّغ كما هو.
#
# الشبكة: نداء GET واحد على نطاق Turso نفسه الذي يُستدعى في المجسّ — نفس
# نطاق الثقة ونفس غرض المصدِر. لا صلاحية كتابة على المستودع ولا على القاعدة.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: turso-credential-audit-${{ github.ref }}
  cancel-in-progress: true

# أقل صلاحية تسمح بتعليق على الطلب إن توفر رقمه؛ لا كتابة على المحتوى.
permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Credential origin probe (status codes only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # أسرار بيئة production — نفس النطاق الذي يقرأه المجسّ ووظيفة النشر.
    environment: production
    # على طلبات هذا الفرع فقط (لا نشغّره على طلبات الآخرين) — ويدويًا متى شئت.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'arena/01a0ea5f-aborof'
    steps:
      - name: Probe credential origins (HTTP codes only)
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # رمز الحالة فقط — ولا شيء غيره. `000` = فشل الشبكة قبل أي استجابة.
          code_probe() { # $1=وصف · $2=ترويسة اختيارية ("" = بلا مصادقة)
            local label="$1" header="$2" code
            if [ -n "$header" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "$header" "$3" || echo 000)
            else
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$3" || echo 000)
            fi
            echo "${label} → HTTP ${code}"
          }

          ORG_API="https://api.turso.tech/v1/organizations"
          USER_API="https://api.turso.tech/v1/user"

          {
            echo "### 🧾 تدقيق عائلة الترخيص — Turso credential audit"
            echo
            echo "- التشغيل: ${RUN_URL:-محلي} · **رموز حالة فقط** — لا قيمة تُطبع."
            echo
            echo "| المرشح | النقطة | رمز الحالة | الحكم |"
            echo "|---|---|---|---|"
            base=$(code_probe "baseline" "" "$ORG_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
            echo "| بلا مصادقة (خط أساس) | GET /v1/organizations | ${base} | ${base:-000} = النقطة حيّة |"

            verdict_for() {
              case "$1" in
                200) echo "✅ **توكن منصّة صالح** — نفس القيمة تُنشئ توكن القاعدة" ;;
                401|403) echo "❌ مرفوض — ليست من Turso (توكن أجنبي)" ;;
                404) echo "⚠️ غير حاسم — نقطة النهاية غير موجودة" ;;
                *) echo "⚠️ غير حاسم — فشل شبكة/استجابة" ;;
              esac
            }

            if [ -n "${TURSO_AUTH_TOKEN:-}" ]; then
              c1=$(code_probe "auth" "Authorization: Bearer ${TURSO_AUTH_TOKEN}" "$ORG_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
              v1=$(verdict_for "$c1")
              echo "| TURSO_AUTH_TOKEN (مضبوط) | GET /v1/organizations | ${c1} | ${v1} |"
              c2=$(code_probe "auth" "Authorization: Bearer ${TURSO_AUTH_TOKEN}" "$USER_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
              v2=$(verdict_for "$c2")
              echo "| TURSO_AUTH_TOKEN (مضبوط) | GET /v1/user | ${c2} | ${v2} |"
            else
              echo "| TURSO_AUTH_TOKEN | — | — | غير مضبوط أصلًا |"
            fi

            if [ -n "${TURSO_API_TOKEN:-}" ]; then
              c3=$(code_probe "api" "Authorization: Bearer ${TURSO_API_TOKEN}" "$ORG_API" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
              v3=$(verdict_for "$c3")
              echo "| TURSO_API_TOKEN (مضبوط) | GET /v1/organizations | ${c3} | ${v3} |"
            else
              echo "| TURSO_API_TOKEN | — | — | غير مضبوط |"
            fi
            echo
            echo "الخلاصة ضمن الجدول أعلاه — والعلاج دائمًا بسطرين:"
            echo '```bash'
            echo 'export TURSO_DATABASE_URL="$(turso db show <db> --url)"'
            echo 'export TURSO_AUTH_TOKEN="$(turso db tokens create <db> --expiration never)"'
            echo 'bash scripts/apply-turso-secrets.sh   # GitHub production + Vercel Production معًا'
            echo '```'
          } > "$HOME/audit.md"

          cat "$HOME/audit.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$HOME/audit.md" >> "$GITHUB_STEP_SUMMARY"; fi

          # تعليق على الطلب إن وُجد رقمه — بلا --edit-last (تلك قناة المجسّ).
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${GH_TOKEN:-}" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$HOME/audit.md" \
              || echo "::warning::تعذّر نشر التعليق — التقرير في ملخّص التشغيل."
          fi
