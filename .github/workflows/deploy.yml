name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target (production only from main; gates never skip)"
        required: true
        default: "production"

concurrency:
  group: deploy-production
  cancel-in-progress: false

# أقل صلاحيات: النشر يحتاج قراءة الكود فقط؛ التوكن في البيئة.
permissions:
  contents: read

jobs:
  # بوابات الجودة شرط مسبق للنشر؛ لا يوجد أي exit 0 أو تخطٍ على فرع الإنتاج.
  quality-gates:
    name: Quality gates (policy, not advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit (blocks on High/Critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Static security gates
        run: npm run security:gates
      - name: Migration files in sync
        run: node scripts/sync-migrations.mjs --check
      - name: Agent manifest in sync
        run: npm run agents:check
      - name: Frontend mandatory files
        run: npm run front:check
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Client bundle secret scan (لا أسرار خادم في ما ينزّله المتصفح)
        run: npm run security:bundle
      - name: Record SHA
        id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Upload test/build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-evidence-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 14
          if-no-files-found: ignore

  # بوابة النشر: تُقرأ داخل نطاق البيئة عبر خطوة shell لا عبر `if` على مستوى الوظيفة.
  #
  # السبب: GitHub يقيّم شروط `if` على مستوى الوظيفة في طور التجميع قبل الدخول إلى
  # البيئة، فلا يرى متغيرات البيئة (environment variables) ويراها فارغة دائمًا.
  # النتيجة السابقة: وظيفة النشر تبقى `skipped` إلى الأبد حتى لو كان
  # VERCEL_DEPLOY_ENABLED=true مضبوطًا على بيئة production (وهو ما حدث فعلًا).
  # هذه الوظيفة الصغيرة تُقرأ فيها القيمة داخل خطوة (حيث نطاق البيئة فعّال) ثم
  # تُصدَّر كمخرج، وتبقى وظيفة النشر `skipped` عند الإغلاق تمامًا كما هو موثّق.
  deploy-gate:
    name: Deploy gate (VERCEL_DEPLOY_ENABLED)
    environment: production
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Read effective VERCEL_DEPLOY_ENABLED
        id: gate
        env:
          # تُقرأ من نطاق البيئة أولًا ثم نطاق المستودع (نفس سلوك GitHub للمتغيرات).
          GATE_VALUE: ${{ vars.VERCEL_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          value="${GATE_VALUE:-}"
          if [ "$value" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ بوابة النشر مفتوحة: VERCEL_DEPLOY_ENABLED=true في النطاق الفعّال."
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          # طباعة القيمة هنا مقصودة وغير سرية (علم موثّق في DEPLOYMENT.md)، وهي ما
          # يجعل التشخيص ممكنًا: قيمة فارغة تعني أن المتغير غائب/موضوع في تبويب
          # Secrets، وقيمة مختلفة تعني خطأ كتابة (المقارنة حرفية وحساسة لحالة الأحرف).
          echo "::warning::بوابة النشر مغلقة: VERCEL_DEPLOY_ENABLED='${value:-<غير معرّف>}' — المطلوب 'true' حرفيًا كـ Variable (لا Secret) في نطاق المستودع أو بيئة production."
          echo "افتح Settings → Secrets and variables → Actions → Variables وأضف VERCEL_DEPLOY_ENABLED=true."

  deploy:
    name: Deploy to Vercel Production
    # ربط النشر ببيئة production على GitHub: يتيح قواعد الحماية (مراجعين/مدة انتظار)
    # ويجعل أسرار النشر مقصورة على هذه البيئة فقط.
    environment: production
    needs: [quality-gates, deploy-gate]
    if: ${{ needs.deploy-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # ‏Variable (لا Secret): اسم المشروع الذي يجب أن يخدم الإنتاج. المستودع
      # مرتبط بثلاثة مشاريع Vercel (aborof، aborof-store-v2، aborof-updated-17d3397)
      # وتكامل Git ينشرها كلها، فبدون هذا الاسم قد ينجح النشر في Actions بينما
      # الخدمة الإنتاجية لم تتغير. غيابه ⇒ الافتراضي aborof (scripts/lib/vercel-link.mjs).
      VERCEL_EXPECTED_PROJECT: ${{ vars.VERCEL_EXPECTED_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # يمنع النشر إذا غابت الأسرار الإلزامية بدل الفشل الصامت أو التخطي.
      - name: Verify required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret $var — refusing to deploy."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required deployment secrets are present."

      # طيران تمهيدي قبل أي أمر vercel: يثبت هوية الرمز والمشروع عبر REST API
      # ويطبع الأسماء فقط (لا قيم سرية — والمعرّفات نفسها محجوبة تلقائيًا كأسرار).
      # السبب: تنزيل سجلات الوظائف محجوب عن بعض الشبكات، فالتعليقات (annotations)
      # هي القناة الوحيدة المقروءة آليًا لتشخيص فشل vercel pull/build/deploy.
      #
      # لماذا Node بدل bash+jq: `404: Project not found` وحدها أوقفت ثلاثة نشرات
      # متتالية بلا حسم، ولها أربعة أسباب مختلفة (نطاق فريق مقابل شخصي، معرّف قديم
      # بعد إعادة إنشاء المشروع، مشروع في حساب آخر، أو مشروع غير الذي يخدم الإنتاج).
      # scripts/vercel-preflight.mjs بلا اعتماديات (fetch مدمج — يعمل قبل npm ci)
      # ويصنّف الرد إلى حكم بأسباب وإجراءات، ويطبع أسماء المشاريع التي يراها الرمز
      # في النطاقين، ويحاجب «نشر ناجح وإنتاج لم يتغير» بمطابقة VERCEL_EXPECTED_PROJECT.
      # المنطق نفسه مُختبَر في tests/vercel-deploy-link.test.ts ضد خادم وهمي.
      - name: Vercel preflight (token & project identity — names only)
        shell: bash
        run: node scripts/vercel-preflight.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild production artifact (gates already enforced)
        run: npm run build
      # كل خطوة vercel تلتقط مخرجاتها وتبثّ ذيل الخطأ كتعليق ::error:: عند الفشل —
      # السجل الكامل يبقى في اللوج (المحجوب عن بعض الشبكات) والتعليق يكفي للتشخيص.
      - name: Pull Vercel production settings
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          out=$(npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::vercel pull فشل (exit $rc): $(printf '%s' "$out" | tr '\n\r' '  ' | tail -c 900)"
          fi
          exit "$rc"
      - name: Build Vercel artifact
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          out=$(npx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::vercel build فشل (exit $rc): $(printf '%s' "$out" | tr '\n\r' '  ' | tail -c 900)"
          fi
          exit "$rc"
      - name: Deploy prebuilt artifact
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          out=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::vercel deploy فشل (exit $rc): $(printf '%s' "$out" | tr '\n\r' '  ' | tail -c 900)"
          fi
          exit "$rc"

  # ملخص نشر مرتبط بالـ SHA ورابط الأثر للرجوع إليه عند الحوادث.
  report:
    name: Deployment summary
    needs: [quality-gates, deploy-gate, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        shell: bash
        run: |
          {
            echo "## Deployment summary"
            echo "- Commit SHA: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Quality gates: ${{ needs.quality-gates.result }}"
            echo "- Deploy gate (VERCEL_DEPLOY_ENABLED): ${{ needs.deploy-gate.outputs.enabled || 'closed/غير معرّف' }}"
            echo "- Deploy: ${{ needs.deploy.result }}"
            echo "- Evidence artifact: deploy-evidence-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
