name: Quality and Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# يمنع تشغيل نسخ قديمة من نفس الفرع عند وصول تحديث أحدث.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# أقل صلاحيات ممكنة على مستوى الـ Workflow؛ تُمنح صلاحيات إضافية لكل خطوة عند الحاجة.
permissions:
  contents: read

jobs:
  gates:
    name: Audit, Lint, Typecheck, Security Gates, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # تثبيت حتمي اعتمادًا على package-lock.json كمصدر وحيد.
      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      # بوابة الاعتماديات: يفشل عند أي ثغرة High/Critical في حزم الإنتاج.
      - name: Dependency audit (High/Critical blocks)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Static security gates
        run: npm run security:gates

      - name: Migration files are in sync
        run: node scripts/sync-migrations.mjs --check

      - name: Route inventory and coverage
        run: npm run routes:inventory

      # بوابة الواجهة: حدود الخطأ والتحميل و404 وميتاداتا المنتج وsitemap/robots
      # — حذف أي منها يترك المستخدم أمام صفحة بيضاء أو منتجًا غير مفهرس.
      - name: Frontend mandatory files
        run: npm run front:check

      # مانيفست الأسطول المولَّد يجب أن يطابق الكود — لا مصدرَي حقيقة متفرّقين.
      - name: Agent manifest in sync
        run: npm run agents:check

      # الاختبارات إلزامية: لا --if-present، أي فشل يوقف الـ Pipeline.
      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      # الفحص الوحيد الذي يقرأ الأثر الذي ينزّله المتصفح فعلاً: أسماء وقيم أسرار
      # الخادم يجب ألا تظهر أبدًا في .next/static (حاجز تسريب حزمة العميل).
      - name: Client bundle secret scan
        run: npm run security:bundle

      # حفظ نتائج البناء كأثر للمراجعة والربط مع الـ SHA.
      - name: Upload build summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-summary-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # فحص مجاني أولي للأنماط الأكثر خطورة. لا يغني عن GitHub Secret Scanning.
      # يُستثنى ملف الـ workflow فقط لأنه يعرّف الأنماط؛ أي نمط اصطناعي في
      # الاختبارات يُبنى وقت التشغيل فلا يظهر كنص ثابت.
      - name: Scan tracked files for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          patterns='(AIzaSy[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z_-]{20,}|nvapi-[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)'
          found=0
          if git grep --cached -n -I -E "$patterns" -- . \
              ':!package-lock.json' \
              ':!.github/workflows/quality.yml' ; then
            found=1
          fi
          if git grep --cached -n -I -E 'TURSO_AUTH_TOKEN=[A-Za-z0-9_-]{20,}' -- . \
              ':!package-lock.json' ':!.github/workflows/quality.yml' \
              | grep -v 'TURSO_AUTH_TOKEN=your_turso_token'; then
            found=1
          fi
          if [ "$found" -eq 1 ]; then
            echo "Potential secret detected in tracked files. Remove or rotate it before merge."
            exit 1
          fi
          echo "No obvious secret patterns found in tracked files."
